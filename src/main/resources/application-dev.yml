server:
  port: 8612

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  main:
    allow-circular-references: true
  application:
    name: rikka-raymi-server
  h2:
    console:
      enabled: true       # 启用 H2 控制台
      path: /h2-console   # 控制台的访问路径，可自定义，默认即为 /h2-console
  datasource:
    # 文件名 _v2:绕开 IDE Database 工具窗口连接的旧 .mv.db 锁(IDE java 进程长期持有文件,
    # 导致 rm 删不掉 inode;改名是规避的最稳手段)。
    # 命名大小写约定:V1 SQL 中所有 schema / table / column 全部不带双引号,
    # 让 H2 默认 DATABASE_TO_UPPER=TRUE 把它们转大写存储(STEAM.OWNED_GAME 等);
    # Hibernate 6 JPA 元数据默认也是大写比对,二者一致,schema-validate 通过。
    # CASE_INSENSITIVE_IDENTIFIERS 兜底,migrate-time 与 validate-time 大小写比对都安全。
    url: jdbc:h2:~/rikka_raymi_v2;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE;
    # 注释1：文件模式，数据会保存在用户目录下的 game_companion_db.mv.db 文件中。
    # 如果希望使用内存模式（应用重启数据丢失），可以替换为: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: root
    password: 123456
    druid:
      # --- 连接池基础设置 ---
      initial-size: 5 # 初始化连接数
      min-idle: 5     # 最小空闲连接数
      max-active: 20  # 最大活跃连接数
      max-wait: 60000 # 获取连接时最大等待时间（毫秒）
      validation-query: SELECT 1
  jpa:
    # H2 dialect 由 Hibernate 自动探测,无需显式声明
    hibernate:
      ddl-auto: validate    # Schema 由 Flyway 管理,JPA 只做元数据校验
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # validate 模式下若出现 Entity 与 DB 列不一致会启动失败,提前暴露问题
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: STEAM,SYSTEM
    # 注意:不要配 default-schema: STEAM。Flyway 在 H2 1.4.198+ 上,当 schemas 含默认 schema(PUBLIC)
    # 之外的 schema 时,把 flyway_schema_history 放到 schemas[0](STEAM)即可;default-schema
    # 与 schemas 同时存在会让 Flyway 误以为需要在 PUBLIC 里再创建一份。

logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE


# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.rikka.raymispring.controller, com.rikka.raymistudio.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

steam:
  api:
    proxyHost: 127.0.0.1
    proxyPort: 7890

encryption:
  aes:
    key: ZefCRrRl/AoyAiTbICOeu46yIwNlWkxb  # 必须是32个字符


